<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>알까기 바</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --panel: rgba(250,243,228,.93);
  --ink:#2b1d14;
  --sub:#6e5845;
  --accent:#b8701f;
  --line: rgba(43,29,20,.16);
  --btn:#2b1d14;
  --btn-ink:#faf3e4;
  --scene:#1b130e;
  color-scheme: light;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel: rgba(38,27,20,.92);
    --ink:#f3e8d4;
    --sub:#bba78e;
    --accent:#f0b553;
    --line: rgba(243,232,212,.14);
    --btn:#f0b553;
    --btn-ink:#22170f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --panel: rgba(38,27,20,.92);
  --ink:#f3e8d4;
  --sub:#bba78e;
  --accent:#f0b553;
  --line: rgba(243,232,212,.14);
  --btn:#f0b553;
  --btn-ink:#22170f;
  color-scheme: dark;
}
html{ height:100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body{
  height:100%; margin:0; background:var(--scene); color:var(--ink);
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  overflow:hidden; -webkit-user-select:none; user-select:none;
}
#app{ position:relative; width:100%; height:100%; overflow:hidden; }
#app canvas{ display:block; touch-action:none; cursor:grab; }
#app canvas:active{ cursor:grabbing; }

.top{
  position:absolute; top:12px; left:12px; right:12px;
  display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  pointer-events:none;
}
.score{
  pointer-events:auto; background:var(--panel); border-radius:16px; padding:8px 14px;
  display:flex; align-items:center; gap:12px; box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.side{ display:flex; flex-direction:column; gap:3px; opacity:.55; transition:opacity .2s; }
.side.turn{ opacity:1; }
.who{ font-size:15px; color:var(--sub); }
.side.turn .who{ color:var(--accent); }
.pips{ display:flex; gap:4px; }
.pip{ width:13px; height:13px; border-radius:50%; }
.pip.b{ background:#1a1a1c; box-shadow: inset 0 -2px 0 rgba(255,255,255,.12), 0 0 0 1px rgba(255,255,255,.18); }
.pip.w{ background:#f1ede4; box-shadow: inset 0 -2px 0 rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.2); }
.pip.gone{ opacity:.18; }
.vs{ font-size:14px; color:var(--sub); }

.cams{ pointer-events:auto; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; max-width:60%; }
.chip{
  font:inherit; font-size:15px; padding:7px 12px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer;
}
.chip:hover{ border-color:var(--accent); }
.chip:focus-visible, .primary:focus-visible, .diff button:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }

.bottom{
  position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:8px; width:min(92%, 460px);
  pointer-events:none;
}
.hint{
  margin:0; background:var(--panel); padding:8px 16px; border-radius:14px; font-size:17px;
  text-align:center; box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.spin{ display:flex; gap:8px; pointer-events:auto; visibility:hidden; }
.spin.on{ visibility:visible; }
.spin .chip{ font-size:16px; padding:8px 16px; touch-action:none; }
.gauge{
  width:100%; height:22px; border-radius:11px; background:var(--panel); position:relative; overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,.25); visibility:hidden;
}
.gauge.on{ visibility:visible; }
.fill{ position:absolute; inset:0 auto 0 0; width:0%; background:linear-gradient(90deg,#8cc46b,#f0b553 55%,#e0573c); }
.gtext{ position:absolute; inset:0; display:grid; place-items:center; font-size:14px; color:#2b1d14; }

.bubble{ position:absolute; left:0; top:0; pointer-events:none; z-index:3; visibility:hidden; }
.bubble span{
  display:block; background:#fffaf0; color:#2b1d14; font-size:21px; padding:6px 14px 7px; border-radius:18px;
  white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.35); transform:scale(.6); opacity:0;
  transition:transform .18s cubic-bezier(.3,1.6,.6,1), opacity .15s;
  position:relative;
}
.bubble span::after{
  content:""; position:absolute; left:50%; bottom:-8px; margin-left:-8px;
  border:8px solid transparent; border-bottom:0; border-top-color:#fffaf0;
}
.bubble.show span{ transform:scale(1); opacity:1; }

.overlay{
  position:absolute; inset:0; display:grid; place-items:center; z-index:5;
  background:rgba(14,9,6,.5); padding:16px;
}
.overlay.hidden{ display:none; }
.card{
  background:var(--panel); color:var(--ink); max-width:380px; width:100%;
  padding:26px 24px 22px; border-radius:22px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.45);
}
.card h1{ font-size:44px; line-height:1.1; margin:0 0 6px; font-weight:400; letter-spacing:-.5px; }
.card h2{ font-size:34px; margin:0 0 6px; font-weight:400; }
.stones{ display:flex; justify-content:center; gap:6px; margin-bottom:10px; }
.stones i{ width:22px; height:22px; border-radius:50%; display:block; }
.stones i:first-child{ background:#1a1a1c; box-shadow:0 0 0 1px rgba(255,255,255,.2); }
.stones i:last-child{ background:#f1ede4; box-shadow:0 0 0 1px rgba(0,0,0,.2); transform:translate(-4px,4px); }
.card p{ margin:8px 0; font-size:17px; line-height:1.55; }
.card p.small{ font-size:15px; color:var(--sub); }
.diff{ display:flex; justify-content:center; gap:6px; margin:16px 0 18px; }
.diff button{
  font:inherit; font-size:16px; padding:7px 14px; border-radius:12px; border:1px solid var(--line);
  background:transparent; color:var(--ink); cursor:pointer;
}
.diff button[aria-pressed="true"]{ background:var(--ink); color:var(--panel); border-color:var(--ink); }
.primary{
  font:inherit; font-size:20px; padding:11px 28px; border-radius:14px; border:0;
  background:var(--btn); color:var(--btn-ink); cursor:pointer;
}
@media (max-width:560px){
  .cams{ max-width:52%; }
  .chip{ font-size:13px; padding:6px 9px; }
  .hint{ font-size:15px; }
  .card h1{ font-size:38px; }
}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="score" aria-live="polite">
      <div class="side" id="side0"><span class="who">나</span><span class="pips" id="pips0"></span></div>
      <span class="vs">vs</span>
      <div class="side" id="side1"><span class="who">상대</span><span class="pips" id="pips1"></span></div>
    </div>
    <div class="cams">
      <button class="chip" data-view="fp">1인칭</button>
      <button class="chip" data-view="me">내 쪽</button>
      <button class="chip" data-view="top">위에서</button>
      <button class="chip" data-view="side">옆에서</button>
      <button class="chip" data-view="them">상대 쪽</button>
      <button class="chip" id="muteBtn">소리 끄기</button>
    </div>
  </div>

  <div class="bottom">
    <div class="spin" id="spin">
      <button class="chip" id="spinL" aria-label="판을 왼쪽으로 돌리기">↺ 판 돌리기</button>
      <button class="chip" id="spinR" aria-label="판을 오른쪽으로 돌리기">판 돌리기 ↻</button>
    </div>
    <div class="gauge" id="gauge"><div class="fill" id="fill"></div><span class="gtext" id="gtext">힘 0%</span></div>
    <p class="hint" id="hint">시작하기를 누르세요.</p>
  </div>

  <div class="overlay" id="startOv">
    <div class="card">
      <div class="stones"><i></i><i></i></div>
      <h1>알까기 바</h1>
      <p>검은 돌이 내 돌이에요. 돌을 누른 채 뒤로 당겼다 놓으면 반대 방향으로 튕겨 나가요.</p>
      <p>상대 돌을 판 밖으로 다 떨어뜨리면 이겨요. 상대 돌만 떨어뜨리면 한 번 더 칠 수 있어요.</p>
      <p>멀리 있는 돌은 손이 안 닿아요. 판 돌리기 버튼이나 Q, E 키로 판을 돌려서 가까이 가져오세요.</p>
      <p class="small">1인칭에서는 판을 직접 끌어서 돌릴 수 있어요. 빈 곳을 끌면 시점이 돌아가요.</p>
      <div class="diff" role="group" aria-label="상대 실력">
        <button data-diff="easy" aria-pressed="false">쉬움</button>
        <button data-diff="normal" aria-pressed="true">보통</button>
        <button data-diff="hard" aria-pressed="false">어려움</button>
      </div>
      <button class="primary" id="startBtn">시작하기</button>
    </div>
  </div>

  <div class="overlay hidden" id="endOv">
    <div class="card">
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <div class="diff" role="group" aria-label="상대 실력">
        <button data-diff="easy" aria-pressed="false">쉬움</button>
        <button data-diff="normal" aria-pressed="true">보통</button>
        <button data-diff="hard" aria-pressed="false">어려움</button>
      </div>
      <button class="primary" id="againBtn">다시 하기</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $ = s => document.querySelector(s);
const app = $('#app');
const V3 = THREE.Vector3;
const UP = new V3(0,1,0);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const wait = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random()*a.length)];
const wrapPi = a => { while (a > Math.PI) a -= Math.PI*2; while (a < -Math.PI) a += Math.PI*2; return a; };
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- 상수 ----------
const H = 1.8;            // 바둑판 반 크기
const R = 0.075;          // 돌 반지름
const SY = R*0.45;        // 판 위 돌 높이(중심)
const DECEL = 2.2, VMAX = 7.5, E = 0.9;
const TABLE_TOP = -0.4, TH = 2.65, FLOOR = -2.4;
const CHAR_Z = 3.3;
const ARM1 = 0.85, ARM2 = 0.85, REACH = (ARM1 + ARM2)*0.97;

// 판 회전: 판 위의 돌은 월드 좌표로 두고, 판이 돌면 같이 돌린다
let boardAng = 0;
function rotXZ(x, z, d){ const c = Math.cos(d), s = Math.sin(d); return [x*c + z*s, -x*s + z*c]; }
function toLocal(x, z){ return rotXZ(x, z, -boardAng); }

// ---------- 렌더러 / 씬 ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.prepend(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b130e);
scene.fog = new THREE.Fog(0x1b130e, 12, 26);
const camera = new THREE.PerspectiveCamera(42, 1, 0.08, 80);

function std(color, rough, metal){ return new THREE.MeshStandardMaterial({ color, roughness: rough==null?0.7:rough, metalness: metal||0 }); }
function mesh(geo, mat, cast, recv){ const m = new THREE.Mesh(geo, mat); m.castShadow = cast!==false; m.receiveShadow = recv!==false; return m; }

scene.add(new THREE.HemisphereLight(0xffe2b8, 0x24160e, 0.55));
const spot = new THREE.SpotLight(0xffd59a, 1.45, 0, 1.05, 0.55, 1);
spot.position.set(0, 3.7, 0); spot.target.position.set(0, 0, 0);
spot.castShadow = true; spot.shadow.mapSize.set(2048, 2048);
spot.shadow.camera.near = 0.5; spot.shadow.camera.far = 12; spot.shadow.bias = -0.0006;
scene.add(spot, spot.target);
const rim = new THREE.DirectionalLight(0xa9b8ff, 0.2); rim.position.set(-6, 5, 3); scene.add(rim);

// ---------- 텍스처 ----------
function plankTex(){
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  for (let i=0;i<8;i++){
    const s = 52 + Math.random()*16;
    g.fillStyle = 'rgb(' + Math.round(s+38) + ',' + Math.round(s+12) + ',' + Math.round(s-10) + ')';
    g.fillRect(0, i*64, 512, 64);
    g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(0, i*64, 512, 2);
    for (let k=0;k<36;k++){
      g.strokeStyle = 'rgba(0,0,0,' + (Math.random()*0.12).toFixed(3) + ')';
      g.beginPath(); const y = i*64 + Math.random()*64;
      g.moveTo(0,y); g.bezierCurveTo(170, y+Math.random()*6-3, 340, y+Math.random()*6-3, 512, y); g.stroke();
    }
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5,5); return t;
}
function boardTex(){
  const S = 1024; const c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  g.fillStyle = '#d7a35f'; g.fillRect(0,0,S,S);
  for (let k=0;k<140;k++){
    g.strokeStyle = 'rgba(130,78,32,' + (0.04+Math.random()*0.1).toFixed(3) + ')'; g.lineWidth = 1+Math.random()*2;
    g.beginPath(); const x = Math.random()*S;
    g.moveTo(x,0); g.bezierCurveTo(x+Math.random()*40-20, S*0.33, x+Math.random()*40-20, S*0.66, x+Math.random()*30-15, S); g.stroke();
  }
  const N = 13, m = 64, step = (S-2*m)/(N-1);
  g.strokeStyle = 'rgba(38,20,8,.85)'; g.lineWidth = 3;
  for (let i=0;i<N;i++){
    g.beginPath(); g.moveTo(m, m+i*step); g.lineTo(S-m, m+i*step); g.stroke();
    g.beginPath(); g.moveTo(m+i*step, m); g.lineTo(m+i*step, S-m); g.stroke();
  }
  g.lineWidth = 6; g.strokeRect(m, m, S-2*m, S-2*m);
  g.fillStyle = 'rgba(38,20,8,.9)';
  [3,6,9].forEach(a => [3,6,9].forEach(b => { g.beginPath(); g.arc(m+a*step, m+b*step, 8, 0, Math.PI*2); g.fill(); }));
  const t = new THREE.CanvasTexture(c); t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}

// ---------- 방 ----------
const room = new THREE.Mesh(new THREE.BoxGeometry(26, 12, 26), new THREE.MeshStandardMaterial({ color:0x2c1d15, roughness:0.95, side:THREE.BackSide }));
room.position.y = FLOOR + 5.99; room.receiveShadow = true; scene.add(room);
const floor = mesh(new THREE.PlaneGeometry(26, 26), new THREE.MeshStandardMaterial({ map: plankTex(), roughness:0.85 }), false, true);
floor.rotation.x = -Math.PI/2; floor.position.y = FLOOR; scene.add(floor);
function shelf(z, rotY){
  const grp = new THREE.Group(); grp.position.z = z; grp.rotation.y = rotY; scene.add(grp);
  const wood = std(0x4a2c1b, 0.7);
  [0.6, 2.0].forEach(y => {
    const b = mesh(new THREE.BoxGeometry(10, 0.12, 0.6), wood); b.position.set(0, y, 0); grp.add(b);
    for (let i=0;i<11;i++){
      const h = 0.5 + Math.random()*0.45, r = 0.09 + Math.random()*0.07;
      const col = pick([0x2f5d3a, 0x8a4b16, 0xd9c9a3, 0x5a1f22, 0x3a4a6b]);
      const mat = new THREE.MeshStandardMaterial({ color:col, roughness:0.2, metalness:0.1, emissive:col, emissiveIntensity:0.12, transparent:true, opacity:0.9 });
      const bt = mesh(new THREE.CylinderGeometry(r, r, h, 12), mat); bt.position.set(-4.4 + i*0.88 + Math.random()*0.2, y + 0.06 + h/2, 0); grp.add(bt);
      const nk = mesh(new THREE.CylinderGeometry(0.035, r*0.7, 0.25, 8), mat); nk.position.set(bt.position.x, y + 0.06 + h + 0.12, 0); grp.add(nk);
    }
  });
  const lamp = new THREE.PointLight(0xffb36b, 0.45, 9); lamp.position.set(0, 3.2, 1); grp.add(lamp);
}
shelf(12.6, Math.PI); shelf(-12.6, 0);

const cord = mesh(new THREE.CylinderGeometry(0.02, 0.02, 6, 6), std(0x111111), false, false); cord.position.y = 7.1; scene.add(cord);
const shade = mesh(new THREE.ConeGeometry(1.0, 0.7, 32, 1, true), new THREE.MeshStandardMaterial({ color:0x2f4536, roughness:0.4, metalness:0.4, side:THREE.DoubleSide }), false, false);
shade.position.y = 4.1; scene.add(shade);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 12), new THREE.MeshBasicMaterial({ color:0xfff1c9 }));
bulb.position.y = 3.9; scene.add(bulb);

// 테이블, 회전판, 바둑판
const table = mesh(new THREE.BoxGeometry(TH*2, 0.25, TH*2), std(0x5a3520, 0.55));
table.position.y = TABLE_TOP - 0.125; scene.add(table);
[[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([a,b]) => {
  const leg = mesh(new THREE.CylinderGeometry(0.14, 0.18, (TABLE_TOP-0.25) - FLOOR, 12), std(0x3d2415, 0.6));
  leg.position.set(a*2.3, (TABLE_TOP-0.25+FLOOR)/2, b*2.3); scene.add(leg);
});
const lazy = mesh(new THREE.CylinderGeometry(1.45, 1.55, 0.08, 48), std(0x2c2c30, 0.35, 0.6));
lazy.position.y = TABLE_TOP + 0.04; scene.add(lazy);
const boardGrp = new THREE.Group(); scene.add(boardGrp);
const sideWood = std(0xb07a3f, 0.6);
const boardTop = new THREE.MeshStandardMaterial({ map: boardTex(), roughness:0.55 });
const board = mesh(new THREE.BoxGeometry(H*2, 0.32, H*2), [sideWood, sideWood, boardTop, sideWood, sideWood, sideWood]);
board.position.y = -0.16; boardGrp.add(board);

// ---------- 돌 ----------
const stoneGeo = new THREE.SphereGeometry(R, 28, 14);
const matB = new THREE.MeshStandardMaterial({ color:0x1a1a1c, roughness:0.3, metalness:0.05, emissive:0x000000 });
const matW = new THREE.MeshStandardMaterial({ color:0xf1ede4, roughness:0.38 });
const stones = [];
function resetStones(){
  stones.forEach(s => scene.remove(s.mesh)); stones.length = 0;
  boardAng = 0; boardGrp.rotation.y = 0;
  [-2,-1,0,1,2].forEach(i => { makeStone(0, i*0.7, -1.3); makeStone(1, i*0.7, 1.3); });
}
function makeStone(team, x, z){
  const m = mesh(stoneGeo, team===0 ? matB : matW); m.scale.y = 0.45; scene.add(m);
  const s = { team, x, z, y:SY, vx:0, vz:0, vy:0, phase:'board', alive:true, mesh:m };
  m.position.set(x, SY, z); stones.push(s); return s;
}
const teamAlive = t => stones.filter(s => s.team===t && s.alive).length;

// ---------- 캐릭터 ----------
function placeLimb(m, a, b){
  const v = b.clone().sub(a); const len = v.length() || 0.0001;
  m.position.copy(a).addScaledVector(v, 0.5);
  m.quaternion.setFromUnitVectors(UP, v.divideScalar(len));
  m.scale.set(1, len, 1);
}

function makeCharacter(o){
  const c = { team:o.team };
  const root = new THREE.Group(); root.position.set(0, 0, o.z); root.rotation.y = o.z < 0 ? 0 : Math.PI;
  scene.add(root); c.root = root;
  const skin = std(o.skin, 0.6), shirt = std(o.shirt, 0.8), pants = std(o.pants, 0.85), shoe = std(0x1d1410, 0.5);
  const lineMat = new THREE.MeshBasicMaterial({ color:0x1d120b });

  const seatM = std(0x6b3f22, 0.55), legM = std(0x3b2416, 0.6);
  const seat = mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.12, 24), seatM); seat.position.set(0, -1.02, -0.05); root.add(seat);
  const sl = mesh(new THREE.CylinderGeometry(0.08, 0.1, 1.32, 10), legM); sl.position.set(0, -1.72, -0.05); root.add(sl);
  const sb = mesh(new THREE.CylinderGeometry(0.42, 0.48, 0.06, 20), legM); sb.position.set(0, FLOOR+0.03, -0.05); root.add(sb);

  // 다리: 허벅지는 엉덩이와 무릎을 잇도록 매 프레임 갱신 (일어설 때 자연스럽게)
  c.thighs = [];
  [-0.27, 0.27].forEach(sx => {
    const th = mesh(new THREE.CylinderGeometry(0.19, 0.19, 1, 12), pants); scene.add(th);
    c.thighs.push({ m:th, sx });
    const kn = mesh(new THREE.SphereGeometry(0.19, 12, 10), pants); kn.position.set(sx, -0.86, 0.75); root.add(kn);

function L2W(c, x, y, z){ return c.root.localToWorld(new V3(x, y, z)); }
function dirL2W(c, x, y, z){ return new V3(x, y, z).applyQuaternion(c.root.quaternion).normalize(); }
function setHand(c, side, pos, fwd, curl, k, fk){

  h.tcurl = curl; h.k = k || 5; h.fk = fk || 10;
}
function handLocal(c, side, x, y, z, fx, fy, fz, curl, k){ setHand(c, side, L2W(c, x, y, z), dirL2W(c, fx, fy, fz), curl, k); }
function restHand(c, side, k){ handLocal(c, side, side==='R' ? -0.45 : 0.45, -0.31, 0.7, side==='R' ? 0.15 : -0.15, 0, 1, 0.55, k || 4); }

function setFace(c, eyes, mouth, brow, browUp){

}
function neutral(c){

// ---------- 손이 닿는지 계산 ----------
// 손을 놓을 위치에 오른팔이 닿으려면 얼마나 숙이고 일어서야 하는지 찾는다. 안 닿으면 null.
const _eul = new THREE.Euler(0, 0, 0, 'YXZ');
function reachPose(c, handW, fwd){
  const lp = c.root.worldToLocal(handW.clone().addScaledVector(fwd, -0.13));
  const yaw = clamp(Math.atan2(lp.x, lp.z)*0.35, -0.4, 0.4);
  for (let i=0;i<=20;i++){
    const p = i/20, lean = p, rise = clamp((p - 0.45)/0.55, 0, 1);
    _eul.set(lean, yaw, 0, 'YXZ');
    const S = new V3(-0.58, 1.12, 0).applyEuler(_eul);
    S.y += -0.88 + 0.35*rise; S.z += 0.35*rise;
    if (S.distanceTo(lp) <= REACH) return { p, lean, rise, yaw };
  }
  return null;
}
const shotHand = (s, dir, extra) => new V3(s.x, 0.12, s.z).addScaledVector(dir, -(R + 0.2 + extra));

function aimPose(c, s, dir, power){
  const fpMe = cam.mode === 'fp' && c === chars[0];
  c.leanRate = fpMe ? 2.2 : 3.5;
  c.focus = new V3(s.x, 0, s.z);
  const pose = reachPose(c, shotHand(s, dir, 0.12 + 0.12*power), dir);
  if (pose){ c.tg.lean = pose.lean; c.tg.rise = pose.rise; c.tg.yaw = pose.yaw; }
  else {
    const lp = c.root.worldToLocal(new V3(s.x, 0, s.z));
    Object.assign(c.tg, { lean:1, rise:1, yaw:clamp(Math.atan2(lp.x, lp.z)*0.35, -0.4, 0.4) });
  }
  setHand(c, 'R', shotHand(s, dir, 0.06*power), dir, 0.9, 5, 8);
  // 많이 숙이면 왼손으로 테이블을 짚는다
  if (!pose || pose.p > 0.3) handLocal(c, 'L', 0.6, -0.3, 0.72, -0.15, 0, 1, 1.0, 4); else restHand(c, 'L');
  return !!pose;
}
async function flick(c, s, dir, power, reaching){

  const h = c.hands.R, t0 = performance.now();
  await wait(reaching ? 60 : 300);
  while (performance.now() - t0 < 1800 &&
    (Math.abs(c.st.lean - c.tg.lean) > 0.04 || Math.abs(c.st.rise - c.tg.rise) > 0.04 || h.pos.distanceTo(h.tpos) > 0.05)) await wait(30);
  const back = shotHand(s, dir, 0.1 + 0.12*power); back.y = 0.14;
  setHand(c, 'R', back, dir, 1.75, 8, 14);
  await wait(330);
  setHand(c, 'R', shotHand(s, dir, -0.02), dir, -0.25, 25, 60);
  await wait(55);
  s.vx = dir.x*power*VMAX; s.vz = dir.z*power*VMAX;
  sfx('flick', power);
  c.focus = null;
  await wait(260);
  restHand(c, 'R', 3.5); restHand(c, 'L', 3);
  Object.assign(c.tg, { lean:0, rise:0, yaw:0 }); c.leanRate = 3;
}

let spinTick = 0;
function grabRim(c){
  const P = L2W(c, -0.35, 0.12, CHAR_Z - 1.6);
  const [lx, lz] = toLocal(P.x, P.z);
  c.grab = { lx, lz, ang0:boardAng }; c.grabbing = true;
  const pose = reachPose(c, P, new V3(-P.x, 0, -P.z).normalize());
  if (pose){ c.tg.lean = pose.lean; c.tg.rise = pose.rise; c.tg.yaw = pose.yaw; }
  c.leanRate = 4; c.focus = new V3(0, 0, 0);
}
function rotateBoard(d, c){
  if (d){
    boardAng += d; boardGrp.rotation.y = boardAng;
    for (const s of stones){
      if (s.phase === 'board'){ const r = rotXZ(s.x, s.z, d); s.x = r[0]; s.z = r[1]; }
      else if (s.phase === 'out' && s.y < TABLE_TOP + 0.3){
        const r = Math.hypot(s.x, s.z); if (r < 2.58){ const f = 2.58/r; s.x *= f; s.z *= f; }
      }
    }
    spinTick += Math.abs(d);
    if (spinTick > 0.18){ spinTick = 0; sfx('tick', 0.5); }
  }
  if (c){
    c.lastSpin = performance.now();
    if (!c.grabbing || Math.abs(boardAng - c.grab.ang0) > 0.5) grabRim(c);
  }
}
function updateGrab(c){
  if (!c.grabbing) return;
  const r = rotXZ(c.grab.lx, c.grab.lz, boardAng);
  setHand(c, 'R', new V3(r[0], 0.12, r[1]), new V3(-r[0], 0, -r[1]), 1.1, 9, 8);
  if (performance.now() - c.lastSpin > 380){
    c.grabbing = false; c.grab = null; restHand(c, 'R');
    Object.assign(c.tg, { lean:0, rise:0, yaw:0 }); c.focus = null;
  }
}
async function spinTo(c, delta){
  rotateBoard(0, c); c.lastSpin = performance.now() + 300;
  await wait(550);
  let left = delta, last = performance.now();
  await new Promise(res => {
    (function step(){
      const now = performance.now(), dt = Math.min(0.05, (now - last)/1000); last = now;
      const m = Math.sign(left)*Math.min(Math.abs(left), 1.7*dt);
      rotateBoard(m, c); left -= m;
      if (Math.abs(left) < 1e-6) res(); else requestAnimationFrame(step);
    })();
  });
  await wait(500);
}

// ---------- 물리 ----------
let lastClack = 0;
function physics(dt){
  const n = 4, h = dt/n;
  for (let i=0;i<n;i++){
    for (const s of stones){
      if (s.phase === 'board' || s.phase === 'out'){
        const sp = Math.hypot(s.vx, s.vz);
        if (sp > 0){
          const dec = (s.phase === 'board' ? DECEL : 6)*h;
          if (sp <= dec){ s.vx = 0; s.vz = 0; } else { const f = (sp-dec)/sp; s.vx *= f; s.vz *= f; }
        }
        s.x += s.vx*h; s.z += s.vz*h;
        if (s.phase === 'board'){
          const [lx, lz] = toLocal(s.x, s.z);
          if (Math.abs(lx) > H || Math.abs(lz) > H){
            s.phase = 'air'; s.alive = false; s.vy = 0.5;
            let [vlx, vlz] = toLocal(s.vx, s.vz);
            if (Math.abs(lx) > H && vlx*Math.sign(lx) < 1) vlx = Math.sign(lx);
            if (Math.abs(lz) > H && vlz*Math.sign(lz) < 1) vlz = Math.sign(lz);
            const w = rotXZ(vlx, vlz, boardAng); s.vx = w[0]; s.vz = w[1];
            sfx('drop', 1); updateScore();
          }
        } else if (s.y > FLOOR + 0.2 && (Math.abs(s.x) > TH || Math.abs(s.z) > TH)){
          s.phase = 'air'; s.vy = 0;
        }
      } else if (s.phase === 'air'){
        s.vy -= 14*h; s.y += s.vy*h; s.x += s.vx*h; s.z += s.vz*h;
        s.mesh.rotation.x += h*7; s.mesh.rotation.z += h*4;
        const onTable = Math.abs(s.x) < TH && Math.abs(s.z) < TH;
        const gy = (onTable ? TABLE_TOP : FLOOR) + SY;
        if (s.y <= gy){
          s.y = gy;
          if (Math.abs(s.vy) > 1.2){ s.vy = -s.vy*0.3; sfx('clack', 0.4); }
          else { s.vy = 0; s.phase = 'out'; s.mesh.rotation.set(0, 0, 0); }
        }
      }
    }
    for (let a=0;a<stones.length;a++){
      const A = stones[a]; if (A.phase !== 'board') continue;
      for (let b=a+1;b<stones.length;b++){
        const B = stones[b]; if (B.phase !== 'board') continue;
        const dx = B.x - A.x, dz = B.z - A.z, d2 = dx*dx + dz*dz;
        if (d2 < 4*R*R && d2 > 1e-9){
          const d = Math.sqrt(d2), nx = dx/d, nz = dz/d, ov = (2*R - d)/2;
          A.x -= nx*ov; A.z -= nz*ov; B.x += nx*ov; B.z += nz*ov;
          const rel = (A.vx - B.vx)*nx + (A.vz - B.vz)*nz;
          if (rel > 0){
            const j = rel*(1+E)/2;
            A.vx -= j*nx; A.vz -= j*nz; B.vx += j*nx; B.vz += j*nz;
            const now = performance.now();
            if (now - lastClack > 40){ lastClack = now; sfx('clack', rel/5); }
          }
        }
      }
    }
  }
  for (const s of stones) s.mesh.position.set(s.x, s.y, s.z);
}
function settle(){
  return new Promise(res => {
    const t0 = performance.now();
    (function chk(){
      const moving = stones.some(s => s.phase === 'air' || Math.hypot(s.vx, s.vz) > 0.02);
      if (!moving || performance.now() - t0 > 9000){
        stones.forEach(s => { if (s.phase !== 'air'){ s.vx = 0; s.vz = 0; } });
        res();
      } else requestAnimationFrame(chk);
    })();

}

let actx = null, muted = false;
function ensureAudio(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function sfx(type, amt){
  if (!actx || muted) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  const a = Math.min(1, amt == null ? 1 : amt);
  if (type === 'clack'){
    o.type = 'triangle'; o.frequency.setValueAtTime(1700 + Math.random()*500, t); o.frequency.exponentialRampToValueAtTime(650, t+0.05);
    g.gain.setValueAtTime(0.05 + 0.25*a, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.08);
  } else if (type === 'flick'){
    o.type = 'square'; o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(260, t+0.04);
    g.gain.setValueAtTime(0.06 + 0.08*a, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.06);
  } else if (type === 'tick'){
    o.type = 'sine'; o.frequency.setValueAtTime(260 + Math.random()*40, t);
    g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.05);
  } else {
    o.type = 'sine'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(150, t+0.22);
    g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.25);
  }
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.3);
}

// ---------- 캐릭터 업데이트 ----------
const tmp = new V3();
let watchPos = null;
const CENTER = new V3(0, 0, 0);
function updateChar(c, dt, t){
  const k = 1 - Math.exp(-dt*7), kl = 1 - Math.exp(-dt*(c.leanRate || 4));
  const st = c.st, tg = c.tg;
  ['lean','rise','yaw','roll','pitchAdd','bounce','wobble'].forEach(key => {
    st[key] += (tg[key] - st[key])*((key === 'lean' || key === 'rise') ? kl : k);
  });
  st.browA += (c.browA - st.browA)*k; st.browUp += (c.browUp - st.browUp)*k;

  const lt = c.focus || watchPos || CENTER;
  const lp = c.root.worldToLocal(lt.clone());
  const hx = lp.x, hz = lp.z - Math.sin(st.lean)*1.9 - 0.35*st.rise, hyv = lp.y - 1.05 - 0.35*st.rise;
  let yawL = Math.atan2(hx, hz), pitchL = Math.atan2(-hyv, Math.hypot(hx, hz));
  yawL = clamp(yawL - st.yaw, -1.0, 1.0);
  pitchL = clamp(pitchL - st.lean + st.pitchAdd, -0.6, 0.9);
  st.hy += (yawL - st.hy)*k; st.hp += (pitchL - st.hp)*k;

  c.torso.rotation.x = st.lean; c.torso.rotation.y = st.yaw;
  c.hips.position.set(0, -0.88 + 0.35*st.rise + Math.abs(Math.sin(t*9))*st.bounce + Math.sin(t*1.6 + c.team*2)*0.012, 0.35*st.rise);
  c.neck.rotation.set(st.hp, st.hy, st.roll + Math.sin(t*11)*st.wobble);
  c.brows.forEach(b => { b.m.rotation.z = b.sx > 0 ? st.browA : -st.browA; b.m.position.y = 0.23 + st.browUp; });

  c.blinkIn -= dt;
  if (c.blinkIn <= 0){ c.blinkT = 0.12; c.blinkIn = 2.5 + Math.random()*3; }
  if (c.blinkT > 0){ c.blinkT -= dt; c.eyesOpen.scale.y = 0.12; } else c.eyesOpen.scale.y = 1;
  c.tearMesh.visible = c.tear;
  if (c.tear){ c.tearT = (c.tearT + dt) % 0.9; c.tearMesh.position.set(0.19, -0.02 - c.tearT*0.45, 0.43 - c.tearT*0.06); }

  c.root.updateMatrixWorld(true);
  const hideBody = c === chars[0] && cam.fpBlend > 0.5;
  c.thighs.forEach(th => {
    placeLimb(th.m, c.hips.localToWorld(new V3(th.sx, 0.02, 0)), c.root.localToWorld(new V3(th.sx, -0.86, 0.75)));
    th.m.visible = !hideBody;
  });
  updateGrab(c);
  ['R','L'].forEach(side => updateArm(c, c.hands[side], dt));
}
function updateArm(c, h, dt){
  const kp = 1 - Math.exp(-dt*h.k), kf = 1 - Math.exp(-dt*h.fk);
  h.pos.lerp(h.tpos, kp); h.fwd.lerp(h.tfwd, kp).normalize(); h.curl += (h.tcurl - h.curl)*kf;

  // 손은 직선이 아니라 살짝 들어 올렸다가 내려놓는 궤적으로 움직인다
  const lift = clamp(h.pos.distanceTo(h.tpos)*0.4, 0, 0.3);
  const jit = Math.max(0, c.st.lean - 0.55)*0.05;
  h.g.position.copy(h.pos); h.g.position.y += lift;
  if (jit > 0){ h.g.position.x += Math.sin(T*37 + h.sx)*jit; h.g.position.y += Math.sin(T*29)*jit*0.5; h.g.position.z += Math.sin(T*41)*jit; }

  const S = c.torso.localToWorld(h.shoulderLocal.clone());
  let W = h.g.position.clone().addScaledVector(h.fwd, -0.13);
  let d = S.distanceTo(W) || 0.0001;
  const dir = W.clone().sub(S).divideScalar(d);
  const L = ARM1 + ARM2;
  // 팔은 늘어나지 않는다: 안 닿으면 쭉 뻗은 데서 멈춤
  if (d > L*0.999){
    d = L*0.999; W = S.clone().addScaledVector(dir, d);
    h.g.position.copy(W).addScaledVector(h.fwd, 0.13);
  }
  tmp.copy(h.g.position).add(h.fwd); h.g.lookAt(tmp); h.fp.rotation.x = h.curl;

  const a = (ARM1*ARM1 - ARM2*ARM2 + d*d)/(2*d), hh = Math.sqrt(Math.max(0, ARM1*ARM1 - a*a));
  const pole = new V3(Math.sign(h.sx)*0.8, -1, -0.5).applyQuaternion(c.root.quaternion);
  pole.addScaledVector(dir, -pole.dot(dir)).normalize();
  const El = S.clone().addScaledVector(dir, a).addScaledVector(pole, hh);
  placeLimb(h.up, S, El); placeLimb(h.fo, El, W); h.el.position.copy(El);

  if (c === chars[0]){
    const fpOn = cam.fpBlend > 0.5;
    h.up.visible = !fpOn;
    const near = fpOn && h.g.position.distanceTo(camera.position) < 0.5;
    h.g.visible = h.fo.visible = h.el.visible = !near;
  }
}

const cam = { t:Math.PI, p:0.95, r:9.5, tt:Math.PI, tp:0.95, tr:9.5, target:new V3(0, -0.3, 0), mode:'orbit', fpBlend:0, yo:0, po:0, look:new V3(0, 0.1, 0.5) };
const fpPos = new V3(), orbPos = new V3(), fpWant = new V3(), lookV = new V3();
const VIEWS = { me:[Math.PI, 0.86, 9.4], top:[Math.PI, 0.12, 9.5], side:[Math.PI/2, 1.0, 10.5], them:[0, 0.86, 9.4] };
function nearestAngle(cur, target){ const TAU = Math.PI*2; const d = ((target - cur) % TAU + TAU*1.5) % TAU - Math.PI; return cur + d; }
function setView(name){
  if (name === 'fp'){ cam.mode = 'fp'; cam.yo = 0; cam.po = 0; return; }
  cam.mode = 'orbit';
  const v = VIEWS[name]; cam.tt = nearestAngle(cam.tt, v[0]); cam.tp = v[1]; cam.tr = v[2];
}
function updateCamera(dt){
  const k = 1 - Math.exp(-dt*(reduceMotion ? 30 : 6));
  cam.t += (cam.tt - cam.t)*k; cam.p += (cam.tp - cam.p)*k; cam.r += (cam.tr - cam.r)*k;
  const aspect = camera.aspect, f = aspect < 1 ? 1 + (1 - aspect)*0.95 : 1;
  const rr = cam.r*f;
  orbPos.set(cam.target.x + rr*Math.sin(cam.p)*Math.sin(cam.t), cam.target.y + rr*Math.cos(cam.p), cam.target.z + rr*Math.sin(cam.p)*Math.cos(cam.t));

  cam.fpBlend += ((cam.mode === 'fp' ? 1 : 0) - cam.fpBlend)*(1 - Math.exp(-dt*(reduceMotion ? 30 : 4)));
  const me = chars[0];
  me.head.localToWorld(fpPos.set(0, 0.32, 0.3));
  fpWant.set(0, 0.1, 0.5);
  if (aim) fpWant.lerp(new V3(aim.s.x, 0, aim.s.z), 0.7);
  else if (me.focus) fpWant.lerp(me.focus, 0.6);
  else if (watchPos) fpWant.lerp(watchPos, 0.5);
  cam.look.lerp(fpWant, 1 - Math.exp(-dt*4));
  if (!orbit){ cam.yo *= Math.exp(-dt*2.5); cam.po *= Math.exp(-dt*2.5); }

  const b = cam.fpBlend, e = b*b*(3 - 2*b);
  camera.position.copy(orbPos).lerp(fpPos, e);
  lookV.copy(cam.target).lerp(cam.look, e);
  camera.lookAt(lookV);
  if (e > 0.01){
    const st = me.st, shake = Math.max(0, st.lean - 0.55)*0.04;
    camera.rotateY(cam.yo*e);
    camera.rotateX((cam.po - st.pitchAdd*0.7 + Math.sin(T*23)*shake)*e);
    camera.rotateZ((st.roll*0.6 + Math.sin(T*11)*st.wobble*0.5 + Math.sin(T*17)*shake)*e);
  }
  const fov = 42 + 20*e;
  if (Math.abs(camera.fov - fov) > 0.01){ camera.fov = fov; camera.updateProjectionMatrix(); }
  me.root.visible = e < 0.6;
}

// ---------- 컴퓨터 상대 ----------
function gauss(){ let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return clamp(Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v), -2.5, 2.5); }
function edgeDist(x, z, dx, dz){
  let t = Infinity;
  if (dx > 1e-6) t = Math.min(t, (H - x)/dx); if (dx < -1e-6) t = Math.min(t, (-H - x)/dx);
  if (dz > 1e-6) t = Math.min(t, (H - z)/dz); if (dz < -1e-6) t = Math.min(t, (-H - z)/dz);
  return t;
}
// 판을 16가지 각도로 돌려본다고 가정하고, 손이 닿는 샷 중 가장 좋은 것을 고른다
function aiPlan(){
  const c = chars[1];
  const own = stones.filter(s => s.team === 1 && s.alive), en = stones.filter(s => s.team === 0 && s.alive);
  let best = null;
  for (let k=0;k<16;k++){
    const d = (k - 8)*Math.PI/8;
    for (const s of own){
      const [sx, sz] = rotXZ(s.x, s.z, d);
      for (const t of en){
        const [tx, tz] = rotXZ(t.x, t.z, d);
        const dx = tx - sx, dz = tz - sz, dist = Math.hypot(dx, dz); if (dist < 1e-3) continue;
        const ux = dx/dist, uz = dz/dist, dir = new V3(ux, 0, uz);
        const pose = reachPose(c, new V3(sx, 0.12, sz).addScaledVector(dir, -(R + 0.2 + 0.24)), dir);
        if (!pose) continue;
        const ox = (t.x - s.x)/dist, oz = (t.z - s.z)/dist;
        let blocked = false;
        for (const q of stones){
          if (!q.alive || q === s || q === t) continue;
          const px = q.x - s.x, pz = q.z - s.z, proj = px*ox + pz*oz;
          if (proj <= 0 || proj >= dist) continue;
          if (Math.abs(px*oz - pz*ox) < 2*R*0.95){ blocked = true; break; }
        }
        const [lx, lz] = toLocal(t.x, t.z), [ldx, ldz] = toLocal(ox, oz);
        const de = edgeDist(lx, lz, ldx, ldz);
        const score = -dist*0.5 - de*0.9 - (blocked ? 8 : 0) - Math.abs(d)*0.25 - pose.p*0.3 + Math.random()*0.3;
        if (!best || score > best.score) best = { s, d, ux, uz, dist, de, score };
      }
    }
  }
  if (!best){
    const s = own[0]; const dir = new V3(-s.x, 0, -s.z).normalize();
    return { s, delta:0, dir, power:0.3 };
  }
  const vt = Math.sqrt(2*DECEL*(best.de + 0.35));
  const v0 = Math.sqrt(Math.pow(vt/((1+E)/2), 2) + 2*DECEL*Math.max(0, best.dist - 2*R));
  const noise = { easy:[0.09, 0.2], normal:[0.045, 0.1], hard:[0.018, 0.05] }[G.diff];
  const ang = Math.atan2(best.ux, best.uz) + gauss()*noise[0];
  const power = clamp(Math.min(1, v0/VMAX*1.08)*(1 + gauss()*noise[1]), 0.12, 1);
  return { s:best.s, delta:best.d, dir:new V3(Math.sin(ang), 0, Math.cos(ang)), power };
}
async function aiTurn(){
  const c = chars[1];
  await wait(500);
  const plan = aiPlan();
  poses.think(c); say(c, pick(['음…', '어디 보자', '이걸로 가볼까']), 1300);
  await wait(1000);
  neutral(c);
  if (Math.abs(plan.delta) > 0.03){
    setHint('상대가 판을 돌리고 있어요…');
    await spinTo(c, plan.delta);
    setHint('상대가 노리는 중이에요…');
  }
  aimPose(c, plan.s, plan.dir, plan.power);
  await wait(900);
  await takeShot(1, plan.s, plan.dir, plan.power, true);
}

// ---------- 입력 ----------
const ptrs = new Map(); let aim = null, orbit = null, pinch = null, spinDrag = null;
const ray = new THREE.Raycaster(), plane = new THREE.Plane(new V3(0,1,0), -SY), ndc = new THREE.Vector2();
function boardPoint(e){
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
  ray.setFromCamera(ndc, camera);
  const p = new V3(); return ray.ray.intersectPlane(plane, p) ? p : null;
}
const onBoard = p => { const [lx, lz] = toLocal(p.x, p.z); return Math.abs(lx) < H && Math.abs(lz) < H; };
function cancelAim(){ if (!aim) return; aim = null; arrow.visible = false; showGauge(false); neutral(chars[0]); }
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  try { canvas.setPointerCapture(e.pointerId); } catch(err){}
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (ptrs.size === 2){
    cancelAim(); orbit = null; spinDrag = null;
    const [a, b] = [...ptrs.values()]; pinch = { d:Math.hypot(a.x-b.x, a.y-b.y), r:cam.tr }; return;
  }
  if (G.state === 'player'){
    const p = boardPoint(e);
    if (p){
      let best = null, bd = 0.32;
      for (const s of stones){ if (s.team === 0 && s.alive){ const d = Math.hypot(s.x - p.x, s.z - p.z); if (d < bd){ bd = d; best = s; } } }
      if (best){ aim = { s:best, dir:null, power:0, ok:true }; showGauge(true, 0, true); chars[0].focus = new V3(best.x, 0, best.z); return; }
      if (cam.mode === 'fp' && onBoard(p)){ spinDrag = { a:Math.atan2(p.x, p.z) }; return; }
    }
  }
  orbit = { x:e.clientX, y:e.clientY };
});
canvas.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && ptrs.size === 2){
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y) || 1;
    cam.tr = clamp(pinch.r*pinch.d/d, 4.5, 16); return;
  }
  if (spinDrag){
    const p = boardPoint(e);
    if (p && Math.hypot(p.x, p.z) > 0.3){
      const a1 = Math.atan2(p.x, p.z);
      rotateBoard(clamp(wrapPi(a1 - spinDrag.a), -0.3, 0.3), chars[0]);
      spinDrag.a = a1;
    }
    return;
  }
  if (aim){
    const p = boardPoint(e); if (!p) return;
    const dx = aim.s.x - p.x, dz = aim.s.z - p.z, len = Math.hypot(dx, dz);
    if (len < 0.06){ aim.power = 0; arrow.visible = false; showGauge(true, 0, true); return; }
    aim.dir = new V3(dx/len, 0, dz/len); aim.power = clamp((len - 0.08)/1.4, 0, 1);
    aim.ok = aimPose(chars[0], aim.s, aim.dir, aim.power);
    updateArrow(aim.s, aim.dir, aim.power, aim.ok); showGauge(true, aim.power, aim.ok);
    return;
  }
  if (orbit){
    if (cam.mode === 'fp'){
      cam.yo = clamp(cam.yo - (e.clientX - orbit.x)*0.004, -0.9, 0.9);
      cam.po = clamp(cam.po - (e.clientY - orbit.y)*0.003, -0.5, 0.5);
    } else {
      cam.tt -= (e.clientX - orbit.x)*0.008;
      cam.tp = clamp(cam.tp - (e.clientY - orbit.y)*0.006, 0.12, 1.45);
    }
    orbit = { x:e.clientX, y:e.clientY };
  }
});
function endPointer(e){
  ptrs.delete(e.pointerId);
  if (pinch && ptrs.size < 2) pinch = null;
  spinDrag = null;
  if (aim){
    if (e.type === 'pointerup' && aim.dir && aim.power > 0.05 && G.state === 'player'){
      if (aim.ok){ const a = aim; aim = null; takeShot(0, a.s, a.dir, a.power, true); }
      else { cancelAim(); say(chars[0], pick(['손이 안 닿아…', '으, 팔이 짧아!']), 1400); setHint('판을 돌려서 돌을 가까이 가져오세요.'); }
    } else cancelAim();
  }
  if (ptrs.size === 0) orbit = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.tr = clamp(cam.tr*(1 + e.deltaY*0.001), 4.5, 16); }, { passive:false });

// ---------- 루프 ----------
function resize(){
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

resetStones(); updateScore();
let last = performance.now(), T = 0;
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now; T += dt;
  if (spinDir && G.state === 'player' && !aim) rotateBoard(spinDir*1.5*dt, chars[0]);
  physics(dt);
  let ws = 0.15, w = null;
  for (const s of stones){ const sp = Math.hypot(s.vx, s.vz) + Math.abs(s.vy); if (sp > ws){ ws = sp; w = s; } }
  watchPos = w ? new V3(w.x, w.y, w.z) : null;
  chars.forEach(c => updateChar(c, dt, T));
  if (G.state === 'start' && !reduceMotion) cam.tt += dt*0.15;
  matB.emissive.setRGB(0, 0, 0);
  if (G.state === 'player'){ const g = 0.06 + 0.05*Math.sin(T*4); matB.emissive.setRGB(g*1.2, g*0.8, g*0.3); }
  updateCamera(dt);
  const lampVis = camera.position.y < 3.5;
  shade.visible = lampVis; cord.visible = lampVis; bulb.visible = lampVis;
  updateBubbles();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
